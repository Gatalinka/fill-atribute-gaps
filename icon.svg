<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- 4x4 grid of cells matching QGIS mAlgorithmFillNoData style -->
  <!-- Filled cells: dark blue-gray #517083 -->
  <!-- Empty/gap cells: light gray #e6e6e6 -->
  <!-- Interpolated cells: medium blue-gray #7c96a8 (semi-transparent feel) -->

  <!-- Row 1: filled, gap, gap, filled -->
  <rect x="1" y="1" width="5" height="5" rx="0.5" fill="#517083" stroke="#3a5060" stroke-width="0.4"/>
  <rect x="7" y="1" width="5" height="5" rx="0.5" fill="#e6e6e6" stroke="#b0b0b0" stroke-width="0.4"/>
  <rect x="13" y="1" width="5" height="5" rx="0.5" fill="#e6e6e6" stroke="#b0b0b0" stroke-width="0.4"/>
  <rect x="19" y="1" width="4" height="5" rx="0.5" fill="#517083" stroke="#3a5060" stroke-width="0.4"/>

  <!-- Row 2: gap, interpolated, interpolated, gap -->
  <rect x="1" y="7" width="5" height="5" rx="0.5" fill="#e6e6e6" stroke="#b0b0b0" stroke-width="0.4"/>
  <rect x="7" y="7" width="5" height="5" rx="0.5" fill="#7c96a8" stroke="#5a7a8e" stroke-width="0.4"/>
  <rect x="13" y="7" width="5" height="5" rx="0.5" fill="#7c96a8" stroke="#5a7a8e" stroke-width="0.4"/>
  <rect x="19" y="7" width="4" height="5" rx="0.5" fill="#e6e6e6" stroke="#b0b0b0" stroke-width="0.4"/>

  <!-- Row 3: gap, interpolated, filled, gap -->
  <rect x="1" y="13" width="5" height="5" rx="0.5" fill="#e6e6e6" stroke="#b0b0b0" stroke-width="0.4"/>
  <rect x="7" y="13" width="5" height="5" rx="0.5" fill="#7c96a8" stroke="#5a7a8e" stroke-width="0.4"/>
  <rect x="13" y="13" width="5" height="5" rx="0.5" fill="#517083" stroke="#3a5060" stroke-width="0.4"/>
  <rect x="19" y="13" width="4" height="5" rx="0.5" fill="#e6e6e6" stroke="#b0b0b0" stroke-width="0.4"/>

  <!-- Row 4: filled, gap, gap, filled -->
  <rect x="1" y="19" width="5" height="4" rx="0.5" fill="#517083" stroke="#3a5060" stroke-width="0.4"/>
  <rect x="7" y="19" width="5" height="4" rx="0.5" fill="#e6e6e6" stroke="#b0b0b0" stroke-width="0.4"/>
  <rect x="13" y="19" width="5" height="4" rx="0.5" fill="#e6e6e6" stroke="#b0b0b0" stroke-width="0.4"/>
  <rect x="19" y="19" width="4" height="4" rx="0.5" fill="#517083" stroke="#3a5060" stroke-width="0.4"/>
</svg>
